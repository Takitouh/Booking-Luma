<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - Luma</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js" defer></script>
</head>
<body>
<header>
    <a href="index.html" id="logo"><img src="imgs/Booking-Luma.png" alt="Booking - Luma"></a>
</header>
<nav id="navbar">
    <ul id="navbar-list">
        <li class="navbar-list-item">
            <a href="index.html" class="navbar-list-item-href"><i>Home</i></a>
        </li>
        <li class="navbar-list-item">
            <a href="support.html" class="navbar-list-item-href"><i>Support</i></a>
        </li>
        <li class="navbar-list-item">
            <a href="index.html#contact" class="navbar-list-item-href"><i>Contact</i></a>
        </li>
    </ul>
</nav>
<div id="toast-div"><h5 id="toast-msg"></h5></div>
<main id="auth-main">
    <div id="auth-card">
        <h1 id="auth-title">Welcome back</h1>
        <form id="login-form" novalidate>
            <div class="input-div">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="input-div">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>

            <button type="button" id="login-button">Log in</button>
            <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
        </form>
    </div>
</main>
<footer id="contact">Contact: lumabooking@luma.com</footer>
</body>
</html>
