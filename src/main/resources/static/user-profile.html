<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Profile - Luma</title>
    <link rel="stylesheet" href="css/userProfile.css">
    <script src="js/userProfile.js" defer></script>
</head>
<body>
<header>
    <a href="index.html" id="logo"><img src="imgs/Booking-Luma.png" alt="Booking - Luma"></a>
    <div id="user-status">
    </div>

</header>
<nav id="navbar">
    <ul id="navbar-list">
        <li class="navbar-list-item">
            <a href="index.html" class="navbar-list-item-href"><i>Home</i></a>
        </li>
        <li class="navbar-list-item">
            <a href="support.html" class="navbar-list-item-href"><i>Support</i></a>
        </li>
        <li class="navbar-list-item">
            <a href="index.html#contact" class="navbar-list-item-href"><i>Contact</i></a>
        </li>
    </ul>
</nav>
<main id="profile-main">
    <div class="profile-container">
        <section class="profile-card">
            <h1 class="profile-title">Account settings</h1>
            <div id="profile-form">
                <div class="form-row">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="First name">
                </div>
                <div class="form-row">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Last name">
                </div>
                <div class="form-row">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="+51 9XXXXXXXX">
                </div>
                <div class="form-actions">
                    <button type="button" id="save-profile">Save changes</button>
                </div>
            </div>
        </section>

        <section id="owner-hotels">
            <h2>My Hotels</h2>
            <div id="owner-hotels-list">
                <a class="hotels-list"><h2 class="hotel-title">Galicia</h2><h3 class="hotel-location">España, Galicia</h3><div class="hotel-card-buttons"><button class="hotel-see-button">See</button><button class="hotel-update-button">Update</button><button class="hotel-delete-button">Delete</button></div></a></div>
        </section>
    </div>
</main>

<footer id="contact">Contact: lumabooking@luma.com</footer>
</body>
</html>
