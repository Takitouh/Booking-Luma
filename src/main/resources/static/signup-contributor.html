<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - Luma</title>
  <link rel="stylesheet" href="css/signup.css">
  <script src="js/signupContributor.js" defer></script>
</head>
<body>
<header>
  <a href="index.html" id="logo"><img src="imgs/Booking-Luma.png" alt="Booking - Luma"></a>
</header>
<nav id="navbar">
  <ul id="navbar-list">
    <li class="navbar-list-item">
      <a href="index.html" class="navbar-list-item-href"><i>Home</i></a>
    </li>
    <li class="navbar-list-item">
      <a href="support.html" class="navbar-list-item-href"><i>Support</i></a>
    </li>
    <li class="navbar-list-item">
      <a href="index.html#contact" class="navbar-list-item-href"><i>Contact</i></a>
    </li>
  </ul>
</nav>
<div id="toast-div"><h5 id="toast-msg"></h5></div>

<main id="auth-main">
  <div id="auth-card">
    <h1 id="auth-title">Become a contributor</h1>
    <form id="signup-form" novalidate>
      <div class="input-row">
        <div class="input-div">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first-name">
        </div>
        <div class="input-div">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last-name">
        </div>
      </div>
      <div class="input-div">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>
      <div class="input-div">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="input-div">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
      </div>

      <button type="button" id="signup-button">Sign up</button>
      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </div>
</main>
<footer id="contact">Contact: lumabooking@luma.com</footer>
</body>
</html>
